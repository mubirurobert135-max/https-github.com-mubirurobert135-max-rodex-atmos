name: Responsive UI smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout existing RODEX Atmos repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Chromium test browser
        run: bunx playwright install --with-deps chromium

      - name: Test phones tablets and desktop
        run: bunx playwright test

      - name: Keep responsive screenshots and failure traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rodex-responsive-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
