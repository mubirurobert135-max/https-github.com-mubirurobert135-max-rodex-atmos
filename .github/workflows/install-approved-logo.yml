name: Install approved RODEX Atmos artwork
on:
  push:
    paths:
      - '.github/workflows/install-approved-logo.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download approved artwork
        env:
          ARTWORK_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F0995a7b7-6f7d-4e26-8ad0-9dee28a455be/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABc-d7VXLLmbg38x50M5WiCPC4HWWrerr78HrsyfDbUk&exp=1793630470&osig=AAAAAAAAAAAAAAAAAAAAAKiQfIGXrkmNNf9wWGKfXFHXaPNOkj5EV-5aDKexgaK4&signer=media-rpc&token=AAIAAU0AJDA5OTVhN2I3LTZmN2QtNGUyNi04YWQwLTlkZWUyOGE0NTViZQAAAAABoZy0_3C1C3zs4Hu6J2TBDseBnNviYyyNKypT_tlnCBYsIA66Eg&x-canva-quality=thumbnail"
        run: |
          curl --fail --location --retry 3 --silent --show-error "$ARTWORK_URL" --output /tmp/rodex-approved-logo.png
          test -s /tmp/rodex-approved-logo.png
      - name: Crop weather emblem and prepare app imagery
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          original = Image.open('/tmp/rodex-approved-logo.png').convert('RGB')
          width, height = original.size
          if width < 100 or height < 100:
              raise ValueError('Unexpected logo dimensions')
          # Keep the supplied sun / cloud / fine circular rays, without
          # including the poster wordmark in the small app icon.
          crop = original.crop((round(width*.20),round(height*.125),round(width*.80),round(height*.595)))
          art = Image.new('RGB',(512,512),'#efeae6')
          art_crop = ImageOps.contain(crop,(480,420),Image.Resampling.LANCZOS)
          art.paste(art_crop,((512-art_crop.width)//2,(512-art_crop.height)//2))
          art.save('public/rodex-emblem.png',format='PNG',optimize=True)
          original.resize((800,800),Image.Resampling.LANCZOS).save('public/rodex-logo-full.png',format='PNG',optimize=True)
          PY
      - name: Commit the self-hosted brand assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/rodex-emblem.png public/rodex-logo-full.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: install approved RODEX Atmos weather emblem'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
