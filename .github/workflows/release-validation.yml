name: RODEX Atmos release validation

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build
