<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Background Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Atmospheric Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="6" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Glowing Sun / Atmosphere Glow -->
  <circle cx="200" cy="190" r="65" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Weather Cloud Emblem -->
  <path d="M 180 340 
           L 340 340 
           A 50 50 0 0 0 340 240 
           A 45 45 0 0 0 300 200 
           A 60 60 0 0 0 190 220 
           A 50 50 0 0 0 180 340 Z" 
        fill="url(#cloudGrad)" 
        filter="url(#glow)"/>

  <!-- Compass Needle Lines -->
  <polygon points="256,100 264,130 256,124 248,130" fill="#38bdf8"/>
  <polygon points="256,412 264,382 256,388 248,382" fill="#818cf8"/>
  <polygon points="100,256 130,264 124,256 130,248" fill="#38bdf8"/>
  <polygon points="412,256 382,264 388,256 382,248" fill="#818cf8"/>
</svg>
