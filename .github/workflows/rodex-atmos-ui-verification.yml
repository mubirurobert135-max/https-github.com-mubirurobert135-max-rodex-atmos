name: RODEX Atmos UI verification

on:
  push:
    branches:
      - ui/dribbble-weather-redesign
      - perf/weather-speed-accuracy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from the project lockfile
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start app and verify responsive dashboard
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          ATMOS_SIGNATURE_VOICE_ID: ${{ secrets.ATMOS_SIGNATURE_VOICE_ID }}
        run: |
          set -euo pipefail
          bun run dev > /tmp/rodex-atmos.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/rodex-atmos.log
            exit 1
          fi

          node scripts/verify_weather_dashboard_visual.js
          node scripts/verify_voice_service.js

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodex-atmos-ui-screenshots
          path: visual-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
