name: RODEX Atmos UI verification

on:
  push:
    branches:
      - ui/dribbble-weather-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app and verify responsive dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/rodex-atmos.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/rodex-atmos.log
            exit 1
          fi

          node scripts/verify_weather_dashboard_visual.js

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodex-atmos-ui-screenshots
          path: visual-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
